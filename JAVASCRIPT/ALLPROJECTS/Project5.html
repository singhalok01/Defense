<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Income Tax Calculator</title>

    <link rel="stylesheet" href="./Project5.css">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <h1>💰 Income Tax Calculator</h1>

            <p class="subtitle">
                Calculate your estimated income tax easily
            </p>

            <form id="taxForm">

                <label for="income">Annual Income (₹)</label>

                <input
                    type="number"
                    id="income"
                    placeholder="Enter your annual income"
                    min="0"
                    required
                >

                <button type="submit">
                    Calculate Tax
                </button>

            </form>

            <div id="result" class="result">

                <h2>Tax Result</h2>

                <p id="taxAmount">₹0</p>

                <p id="taxMessage">
                    Enter your income to calculate tax.
                </p>

            </div>

            <button id="resetBtn" class="reset">
                Reset
            </button>

        </div>

    </div>

    <script src="./Project5.js"></script>

</body>
</html>
