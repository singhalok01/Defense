<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="Project6.css">
</head>

<body>

    <div class="container">

        <h1>Smart To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter your task...">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="task-info">
            <span id="taskCount">0 Tasks</span>
            <button id="clearBtn">Clear Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

    </div>

    <script src="Project6.js"></script>
</body>
</html>
