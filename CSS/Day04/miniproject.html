<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="./miniproject.css">

<body>
    <div class="box" style="background-color:rgb(203, 16, 16);">

        <form style="background-color: white;">

            <h1>Login</h1>
            <div>
                <label for="first" style="display: block;">Username</label>

            <div>

            <button
                style=" background-color: rgb(81, 8, 239); width: 100%; height: 40px; font-weight: 600; color: rgb(12, 228, 4);">Login</button>

        </form>


    </div>
