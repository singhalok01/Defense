<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .B {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }

        .A {
            background-color: rgb(251, 7, 7);
            height: 100px;
            width: 100px;
            border-radius: 50%;
            box-shadow: 0px 0px 50px 5px rgb(240, 107, 6);
            animation-name: alok;
            animation-timing-function: linear;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            

        }

        @keyframes alok {
            from {
                transform: rotate(0deg)
            }

            to {
                transform: rotate(360deg)
            }
        }
    </style>
</head>

<body>
    <div class="B">
        <div class="A">a</div>
    </div>
</body>

</html>
