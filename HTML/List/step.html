<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Unordered List</h1>
    <ul>
        <li>Step1</li>
        <li>Step2
            <ul>
                <li>Step 2.1</li>
                <li>Step 2.2</li>
                <ul>
                    <li>Step 2.2.1</li>
                    <li>Step 2.2.2</li>
                    <li>Step 2.2.3</li>
                </ul>
                <li>Step 2.3</li>
                <li>Step 2.4</li>
            </ul>
        </li>
        <li>Step 3</li>
        <ul>
            <li>Step 3.1</li>
        </ul>
        <li>Step 4</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>Step 1</li>
        <li>Step 2</li>
        <ol type="a">
            <li>Step 2.1</li>
            <li>Step 2.2</li>
        </ol>
        <li>Step 3</li>
        <li>Step4</li>
    </ol>
</body>

</html>
