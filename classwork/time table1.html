<html>

<head>
    <style>
        table,th,td{
            border: 1px solid rgb(0, 0, 0);
            border-collapse: collapse;
            width: 100%;
            height: 20px;
            text-align: center;
            padding: 10px;
            border-spacing: 30px;
            margin: 30px;

        }
        .h2{
               
        background-color: aqua;
        }
        tr :nth-child(2){
         background-color: blue;
        }
       
    </style>
</head>

<body>
    <table border="1">
        <caption>
            <h2>Time Table</h2>
        </caption>
        <tr>
            <th class="h2">Day/period</th>
            <th class="h2">9:30-10:20</th>
            <th class="h2">10:20-11:10</th>
            <th>11:10-12:00</th>
            <th>12:00-12:40</th>
            <th>12:40-1:30</th>
            <th>1:30-2:20</th>
            <th>2:20-3:10</th>
            <th>3:10-4:10</th>
        </tr>
        <tr>
            <th>Monday</th>
            <td>Eng</td>
            <td>Mat</td>
            <td>Che</td>
            <td rowspan="7">L<br>U<br>N<br>C<br>H</td>
            <td colspan="3">LAB</td>
            <td>Phy</td>
        </tr>
        <tr>
            <th>Tuesday</th>
            <td colspan="3">LAB</td>
            <td>Eng</td>
            <td>Che</td>
            <td>Mat</td>
            <td>SPORT</td>
        </tr>
        <tr>
            <th>Wednesday</th>
            <td>Mat</td>
            <td>Phy</td>
            <td>Eng</td>
            <td>Che</td>
            <td colspan="3">LAB</td>
        </tr>
        <tr>
            <th>Thusday</th>
            <td>Phy</td>
            <td>Eng</td>
            <td>Che</td>
            <td colspan="3">LAB</td>
            <td>Mat</td>
        </tr>
        <tr>
            <th>Friday</th>
            <td colspan="3">LAB</td>
            <td>Mat</td>
            <td>Che</td>
            <td>Eng</td>
            <td>Phy</td>
        </tr>
        <tr>
            <th>Saturday</th>
            <td>Eng</td>
            <td>Che</td>
            <td>Mat</td>
            <td colspan="3">SEMINAR</td>
            <td>SPORTS</td>
        </tr>


    </table>
</body>

</html>
